[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "behavioral-record-policy-selection"
version = "1.0.0"
description = "Objective-agnostic behavioral records for LLM policy selection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Research prototype contributors"}]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "pillow>=10"]
highway = ["highway-env>=1.10,<2", "stable-baselines3>=2.6,<3", "gymnasium>=1.1,<2"]
dev = ["pytest>=8"]
legacy = ["numpy", "gymnasium", "stable-baselines3"]
standard = ["minigrid>=3.0,<4", "numpy>=1.26"]
lunarlander = [
  "gymnasium>=1.1,<2",
  "Box2D==2.3.10; python_version < '3.14'",
  "pygame-ce>=2.1.3",
  "numpy>=1.26",
  "stable-baselines3>=2.6,<3",
]

[project.scripts]
behavior-records = "behavioral_records.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
